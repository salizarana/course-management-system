<div class="course-list-container">
  <h2 class="page-title">Available Courses</h2>

  <div class="course-grid">
    <mat-card class="course-card" *ngFor="let course of courses">
      <div class="image-wrapper">
        <img [src]="course.image" alt="{{ course.title }}" />
      </div>
      <mat-card-header>
        <mat-card-title>{{ course.title }}</mat-card-title>
        <mat-card-subtitle>{{ course.instructor }}</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <p>{{ course.description }}</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button color="primary" (click)="viewDetails(course)">
          View Details
        </button>
        <button
          mat-stroked-button
          color="accent"
          (click)="openEnrollDialog(course)"
        >
          Enroll
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
